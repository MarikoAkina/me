appId: io.sqllab.desktop
productName: SQL LAB
directories:
  app: desktop
  output: release
  buildResources: desktop
files:
  - '**/*'
  - '!prepare.mjs'
  - '!release-notes.md'
  - '!clear-metadata.cjs'
  - '!update-manifest.cjs'
  - '!package-lock.json'
asar: true
npmRebuild: false
copyright: ""
afterPack: desktop/clear-metadata.cjs
win:
  target:
    - target: nsis
      arch: [x64]
  icon: desktop/icon.ico
  artifactName: SQL-Lab-Setup-${version}.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SQL LAB
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  differentialPackage: false
  installerLanguages: [zh_CN, en_US]
publish:
  provider: github
  owner: MarikoAkina
  repo: sql-lab
  releaseType: release
