ext x="699" y="270" dominant-baseline="text-before-edge" font-family="monospace" font-size="24" fill="#edf5ff">       SUM(amount) AS total</text><text x="699" y="309" dominant-baseline="text-before-edge" font-family="monospace" font-size="24" fill="#edf5ff">FROM expenses</text><text x="699" y="348" dominant-baseline="text-before-edge" font-family="monospace" font-size="24" fill="#edf5ff">GROUP BY category;</text><text x="699" y="399" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#adcaff">DECIMAL 十进制金额计算</text><rect x="55" y="481" width="1172" height="99" rx="18" fill="white"/><text x="79" y="504" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC, sans-serif" font-size="26" fill="#172b46">免费开源 · 无需配置数据库服务器</text><text x="79" y="548" dominant-baseline="text-before-edge" font-family="monospace" font-size="20" fill="#5b6b81">github.com/MarikoAkina/sql-lab</text><rect x="952" y="505" width="250" height="51" rx="12" fill="#176ce2"/><text x="979" y="518" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="white">打开网页即可练习</text><text x="57" y="601" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#5b6b81">MySQL 基础学习模拟器 · 支持范围与兼容差异见项目文档</text></svg>